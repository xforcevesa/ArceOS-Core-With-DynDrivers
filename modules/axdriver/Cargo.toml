[package]
name = "axdriver"
version.workspace = true
edition.workspace = true
authors = [
    "Yuekai Jia <equation618@gmail.com>",
    "ChengXiang Qi <kuangjux@outlook.com>",
]
description = "ArceOS device drivers"
license.workspace = true
homepage.workspace = true
repository = "https://github.com/arceos-org/arceos/tree/main/modules/axdriver"
documentation = "https://arceos-org.github.io/arceos/axdriver/index.html"

[features]
bus-mmio = []
bus-pci = ["dep:axdriver_pci", "dep:axhal", "dep:axconfig"]
block = ["axdriver_block"]
display = ["axdriver_display"]
input = ["axdriver_input"]
net = ["axdriver_net"]
vsock = ["axdriver_vsock"]

dyn = [
  "dep:rdrive",
  "dep:arm-gic-driver",
  "arm-gic-driver?/rdif",
  "dep:rdif-intc",
  "dep:rdif-block",
  "dep:dma-api",
  "dep:axklib",
  "axdriver_block",
  "axdriver_block/gpt",
]

# Enabled by features `virtio-*`
virtio = ["axdriver_virtio", "dep:axalloc", "dep:axhal", "dep:axconfig"]

# various types of drivers
virtio-blk = ["block", "virtio", "axdriver_virtio/block"]
virtio-gpu = ["display", "virtio", "axdriver_virtio/gpu"]
virtio-input = ["input", "virtio", "axdriver_virtio/input"]
virtio-net = ["net", "virtio", "axdriver_virtio/net"]
virtio-socket = ["vsock", "virtio", "axdriver_virtio/socket"]
bcm2835-sdhci = ["block", "axdriver_block/bcm2835-sdhci"]
ramdisk = ["block", "axdriver_block/ramdisk", "dep:axhal", "dep:axconfig"]
sdmmc-gpt = [
    "block",
    "axdriver_block/sdmmc",
    "axdriver_block/gpt",
    "dep:axhal",
    "dep:axconfig",
]
ixgbe = ["net", "axdriver_net/ixgbe", "dep:axalloc", "dep:axhal", "dep:axdma"]
fxmac = ["net", "axdriver_net/fxmac", "dep:axalloc", "dep:axhal", "dep:axdma"]
# more devices example: e1000 = ["net", "axdriver_net/e1000"]

[dependencies]
axalloc = { workspace = true, optional = true }
axconfig = { workspace = true, optional = true }
axdma = { workspace = true, optional = true }
axhal = { workspace = true, optional = true }

axklib = {workspace = true, optional = true}

axdriver_base = { git = "https://github.com/Starry-OS/axdriver_crates.git", rev = "a263470" }
axdriver_block = { git = "https://github.com/Starry-OS/axdriver_crates.git", rev = "a263470", optional = true }
axdriver_display = { git = "https://github.com/Starry-OS/axdriver_crates.git", rev = "a263470", optional = true }
axdriver_input = { git = "https://github.com/Starry-OS/axdriver_crates.git", rev = "a263470", optional = true }
axdriver_net = { git = "https://github.com/Starry-OS/axdriver_crates.git", rev = "a263470", optional = true }
axdriver_pci = { git = "https://github.com/Starry-OS/axdriver_crates.git", rev = "a263470", optional = true }
axdriver_vsock = { git = "https://github.com/Starry-OS/axdriver_crates.git", rev = "a263470", optional = true }
axdriver_virtio = { git = "https://github.com/Starry-OS/axdriver_crates.git", rev = "a263470", optional = true }

cfg-if = { workspace = true }
crate_interface = { workspace = true }
log = { workspace = true }

gpt_disk_io = "0.16.2"

axerrno = {workspace = true}

dma-api = {version = "0.5", features = ["alloc"], optional = true}
lazyinit = "0.2"

memory_addr = "0.4"
rdif-block = {version = "0.6.2", optional = true}
rdif-intc = {version = "0.12", optional = true}
rdrive = {version = "0.18", optional = true}
spin = "0.10"

[target.'cfg(target_arch = "aarch64")'.dependencies]
arm-gic-driver = {version = "0.15", optional = true}

